<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SuperPalavra</title>
<meta name="theme-color" content="#7c3aed">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Direção: mar de aventura, vivo e legível. Layout de telemóvel em coluna, botões grandes. */
:root{
  --fundo:#e9f8ff;
  --mar:#1fb5c9;
  --mar-fundo:#0b3d6e;
  --coral:#ff6b5b;
  --sol:#ffc933;
  --alga:#25b36a;
  --tinta:#10324f;
  --suave:#5b7a93;
  --branco:#ffffff;
  --f-marca:'Baloo 2','Nunito','Trebuchet MS',system-ui,sans-serif;
  --f-texto:'Lexend','Verdana',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--fundo);color:var(--tinta);font-family:var(--f-texto);font-size:17px;line-height:1.4;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--sol);outline-offset:3px}
#app{max-width:520px;height:100%;margin:0 auto;position:relative;overflow:hidden;background:
  radial-gradient(120% 60% at 50% -10%,#fff 0,transparent 60%),
  linear-gradient(180deg,#bdeeff 0%,#e9f8ff 38%,#d8f3ff 100%)}
#screen{height:100%;overflow-y:auto;overflow-x:hidden;padding:14px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.waves{position:absolute;left:0;right:0;bottom:0;height:90px;pointer-events:none;opacity:.55}
h1,h2,h3{font-family:var(--f-marca);margin:0;line-height:1.05}
h2{font-size:28px;font-weight:800}
h3{font-size:20px;font-weight:800}
p{margin:0}
.muted{color:var(--suave);font-size:15px}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:12px 22px;border-radius:20px;font-family:var(--f-marca);font-weight:800;font-size:22px;color:#fff;background:var(--mar);box-shadow:0 6px 0 #0e8596;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #0e8596}
.btn.coral{background:var(--coral);box-shadow:0 6px 0 #c9402f}.btn.coral:active{box-shadow:0 1px 0 #c9402f}
.btn.sol{background:var(--sol);color:#5a3b00;box-shadow:0 6px 0 #c99500}.btn.sol:active{box-shadow:0 1px 0 #c99500}
.btn.alga{background:var(--alga);box-shadow:0 6px 0 #187a47}.btn.alga:active{box-shadow:0 1px 0 #187a47}
.btn.ghost{background:#fff;color:var(--mar-fundo);box-shadow:0 6px 0 #b9d4e2}.btn.ghost:active{box-shadow:0 1px 0 #b9d4e2}
.btn.big{min-height:72px;font-size:30px;border-radius:26px;width:100%}
.btn.small{min-height:44px;font-size:17px;padding:8px 16px;border-radius:14px;box-shadow:0 4px 0 #0e8596}
.btn.small.ghost{box-shadow:0 4px 0 #b9d4e2}
.btn[disabled]{opacity:.5;pointer-events:none}
.iconbtn{width:48px;height:48px;border-radius:16px;background:#fff;display:grid;place-items:center;box-shadow:0 4px 0 #b9d4e2;color:var(--mar-fundo)}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #b9d4e2}
svg.ico{width:26px;height:26px;fill:currentColor;flex:none}

/* barra superior */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.coins{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:6px 16px 6px 8px;font-family:var(--f-marca);font-weight:800;font-size:24px;box-shadow:0 4px 0 #b9d4e2;color:#8a5a00}
.coins svg{width:34px;height:34px}
.coins.pop{animation:pop .5s}
@keyframes pop{30%{transform:scale(1.25)}100%{transform:scale(1)}}

/* início */
.home{align-items:center;text-align:center;justify-content:flex-start}
.brand{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:2px}
.wordmark{font-family:var(--f-marca);font-weight:800;font-size:50px;letter-spacing:.5px;color:var(--mar-fundo);text-shadow:0 3px 0 #fff;line-height:1}
.wordmark b{color:var(--coral);font-weight:800}
.tagline{font-size:17px;color:var(--suave)}
.hero{position:relative;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:0;margin:2px 0}
.hero .mascot{width:190px;height:190px;animation:float 3.2s ease-in-out infinite}
.hero .logo{position:absolute;left:4px;top:8px;width:84px;height:84px;filter:drop-shadow(0 4px 0 rgba(11,61,110,.25));transform:rotate(-8deg)}
@keyframes float{50%{transform:translateY(-8px) rotate(2deg)}}
.menu{display:grid;gap:14px;width:100%}
.menu2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.menu2 .btn{font-size:22px;flex-direction:column;gap:2px;padding:12px 8px;min-height:84px}
.chip-n{font-family:var(--f-texto);font-size:14px;font-weight:600;opacity:.95}
.rest{background:#fff;border-radius:22px;padding:16px;box-shadow:0 5px 0 #b9d4e2;text-align:left}
.foot{display:flex;justify-content:center;margin-top:auto}

/* jogo */
.play{gap:12px}
.dots{display:flex;gap:6px;flex:1;justify-content:center}
.dot{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 3px #b9d4e2}
.dot.on{background:var(--sol);box-shadow:inset 0 0 0 3px #e0a800}
.dot.now{box-shadow:inset 0 0 0 3px var(--mar-fundo);background:#fff}
.talk{display:flex;align-items:flex-end;gap:8px}
.talk .mascot{width:92px;height:92px;flex:none}
.bubble{position:relative;background:#fff;border-radius:20px;padding:12px 16px;box-shadow:0 4px 0 #b9d4e2;font-size:18px;font-weight:600;min-height:54px;display:flex;align-items:center;flex:1}
.bubble::before{content:"";position:absolute;left:-9px;bottom:16px;border:9px solid transparent;border-left:0;border-right-color:#fff}
.wordcard{background:#fff;border-radius:30px;box-shadow:0 8px 0 #b9d4e2;padding:26px 12px;min-height:170px;display:flex;align-items:center;justify-content:center;text-align:center}
.word{font-family:var(--f-texto);font-weight:800;display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:0 .15em;font-size:clamp(40px,13vw,68px);line-height:1.15}
.word.long{font-size:clamp(32px,10vw,54px)}
.word.xlong{font-size:clamp(26px,8vw,44px)}
.word.spaced{letter-spacing:.06em}
.word.upper{text-transform:uppercase}
.syl{display:inline-block;padding:0 .04em;border-radius:12px;transition:background .2s,transform .2s}
.syl.s0{color:var(--mar-fundo)}.syl.s1{color:var(--coral)}
.syl.lit{background:#fff2b8;transform:translateY(-4px)}
.sep{color:#9fb6c9;font-weight:600}
.row{display:flex;gap:12px}
.row>*{flex:1}
.micwrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.mic{width:116px;height:116px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;box-shadow:0 8px 0 #c9402f;transition:transform .08s,box-shadow .08s}
.mic:active{transform:translateY(6px);box-shadow:0 2px 0 #c9402f}
.mic svg{width:56px;height:56px;fill:#fff}
.mic.listening{animation:pulse 1s infinite;background:#e0344a}
@keyframes pulse{0%{box-shadow:0 8px 0 #9d1f31,0 0 0 0 rgba(224,52,74,.55)}100%{box-shadow:0 8px 0 #9d1f31,0 0 0 26px rgba(224,52,74,0)}}
.hint{font-size:16px;color:var(--suave);text-align:center;min-height:24px}
.earn{display:flex;justify-content:center;align-items:center;gap:6px;font-family:var(--f-marca);font-weight:800;font-size:30px;color:#8a5a00;min-height:44px}
.earn svg{width:38px;height:38px}
.earn .fly{animation:rise .9s ease-out both}
@keyframes rise{0%{transform:translateY(16px) scale(.6);opacity:0}40%{opacity:1;transform:translateY(0) scale(1.15)}100%{transform:translateY(0) scale(1)}}
.adultbar{display:flex;gap:10px;flex-wrap:wrap}
.hold{position:relative;overflow:hidden;min-height:44px;padding:8px 14px;border-radius:14px;background:#fff;color:var(--mar-fundo);font-size:15px;font-weight:600;box-shadow:0 4px 0 #b9d4e2;user-select:none;touch-action:none}
.hold::after{content:"";position:absolute;left:0;bottom:0;height:5px;width:0;background:var(--alga)}
.hold.holding::after{width:100%;transition:width 1s linear}

/* resumo */
.summary{align-items:center;text-align:center;gap:16px}
.summary .mascot{width:170px;height:170px;animation:hop 1s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-14px)}}
.stat{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.pill{background:#fff;border-radius:18px;padding:10px 16px;box-shadow:0 4px 0 #b9d4e2;font-weight:800;font-family:var(--f-marca);font-size:24px;display:flex;align-items:center;gap:8px}
.pill small{display:block;font-family:var(--f-texto);font-size:13px;font-weight:600;color:var(--suave)}

/* loja e álbum */
.tabs{flex:none;min-height:46px;display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 16px;border-radius:999px;background:#fff;font-weight:600;font-size:16px;box-shadow:0 3px 0 #b9d4e2;color:var(--mar-fundo)}
.tab[aria-pressed="true"]{background:var(--mar-fundo);color:#fff;box-shadow:0 3px 0 #061f38}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid.g3{grid-template-columns:repeat(3,1fr);gap:10px}
.cell{position:relative;display:flex;flex-direction:column;gap:6px;text-align:center}
.cell .card-svg{width:100%;height:auto;filter:drop-shadow(0 6px 0 rgba(11,61,110,.18));border-radius:18px}
.cell.own .card-svg{filter:drop-shadow(0 6px 0 rgba(11,61,110,.18))}
.cell .qty{position:absolute;top:6px;right:6px;background:var(--coral);color:#fff;border-radius:999px;font-family:var(--f-marca);font-weight:800;font-size:15px;padding:0 9px;box-shadow:0 2px 0 #c9402f}
.price{display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--f-marca);font-weight:800;font-size:19px;color:#8a5a00;background:#fff;border-radius:14px;padding:4px 8px;box-shadow:0 3px 0 #b9d4e2}
.price svg{width:24px;height:24px}
.price.ok{background:var(--sol);color:#5a3b00;box-shadow:0 3px 0 #c99500}
.bar{height:8px;border-radius:6px;background:#d6e6f0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--alga);border-radius:6px}
.count{font-size:15px;color:var(--suave);text-align:center}
.cell button.card-btn{display:block;width:100%;border-radius:18px}

/* janelas */
.overlay{position:absolute;inset:0;z-index:20;background:rgba(6,31,56,.62);display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:#fff;border-radius:28px;padding:20px;max-width:380px;width:100%;max-height:92%;overflow:auto;box-shadow:0 10px 0 rgba(0,0,0,.15);display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.sheet .card-svg{width:min(62vw,260px);height:auto;border-radius:18px;filter:drop-shadow(0 8px 0 rgba(11,61,110,.2))}
.flip{perspective:900px}
.flip .inner{position:relative;width:min(62vw,260px);aspect-ratio:200/260;transition:transform 1s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.flip.go .inner{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden}
.flip .face.back{transform:rotateY(180deg)}
.flip .card-svg{width:100%}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:10px;height:16px;border-radius:3px;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

/* adultos */
.adult{gap:16px}
.panel{background:#fff;border-radius:22px;padding:16px;box-shadow:0 5px 0 #b9d4e2;display:flex;flex-direction:column;gap:12px}
.panel h3{font-size:21px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 14px;border-radius:999px;background:#eef6fb;font-weight:600;font-size:16px;box-shadow:inset 0 0 0 2px #cfe0ec;color:var(--mar-fundo)}
.chip[aria-pressed="true"]{background:var(--mar);color:#fff;box-shadow:inset 0 0 0 2px #0e8596}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lab{font-weight:600;font-size:16px}
select,textarea,input[type=number],input[type=text]{font:inherit;padding:10px 12px;border-radius:12px;border:2px solid #cfe0ec;background:#fff;color:var(--tinta);width:100%}
textarea{min-height:90px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--mar)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;font-weight:600;font-size:16px}
.switch button{width:58px;height:34px;border-radius:999px;background:#cfe0ec;position:relative;flex:none}
.switch button::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.switch button[aria-pressed="true"]{background:var(--alga)}
.switch button[aria-pressed="true"]::after{transform:translateX(24px)}
.note{background:#fff7da;border-radius:14px;padding:10px 12px;font-size:15px}
.warn{background:#ffe5e0;border-radius:14px;padding:10px 12px;font-size:15px}
.train{display:flex;flex-wrap:wrap;gap:8px}
.train span{background:#eef6fb;border-radius:12px;padding:4px 10px;font-weight:600}
.gate{align-items:center;text-align:center}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:300px}
.keypad .btn{min-height:60px;font-size:26px;border-radius:16px;box-shadow:0 4px 0 #0e8596}
.answer{font-family:var(--f-marca);font-weight:800;font-size:44px;min-height:56px;letter-spacing:6px}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media (max-height:700px){
  .hero .mascot{width:150px;height:150px}
  .wordmark{font-size:46px}
  .wordcard{min-height:130px;padding:16px 10px}
  .mic{width:96px;height:96px}
}

.listen{width:88px;height:88px;border-radius:50%;background:var(--sol);color:#5a3a00;display:grid;place-items:center;box-shadow:0 6px 0 #c99a00;margin:0 auto}
.listen .ico{width:44px;height:44px}
.listen:active,.listen.on{transform:translateY(4px);box-shadow:0 2px 0 #c99a00}
.listen.on{animation:lglow 1s ease-in-out infinite}
@keyframes lglow{0%{box-shadow:0 2px 0 #c99a00,0 0 0 0 rgba(255,201,51,.7)}100%{box-shadow:0 2px 0 #c99a00,0 0 0 22px rgba(255,201,51,0)}}
.picks{display:flex;gap:12px;width:100%;margin-top:6px}
.pick{flex:1;min-width:0;border-radius:20px;transition:transform .15s}
.pick:active{transform:scale(.96)}
.pick .card-svg{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 0 rgba(30,40,90,.25))}

.listen{flex:none;width:88px;min-width:88px;max-width:88px;height:88px}
.row:has(.listen){justify-content:center}

</style>
</head>

/* ===== Arte procedural das cartas: utilitários, fundos, peixes e pássaros ===== */
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  const f=v=>Math.max(0,Math.min(255,v+amt));
  const r=f(n>>16),g=f((n>>8)&255),b=f(n&255);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
let UID_N=0; const nextUid=()=>'u'+(++UID_N);
const lin=(id,c1,c2,x2=0,y2=1)=>`<linearGradient id="${id}" x1="0" y1="0" x2="${x2}" y2="${y2}"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>`;
const rad=(id,c1,o1,c2,o2)=>`<radialGradient id="${id}"><stop offset="0" stop-color="${c1}" stop-opacity="${o1}"/><stop offset="1" stop-color="${c2}" stop-opacity="${o2}"/></radialGradient>`;
const star4=(x,y,s,c='#fff',o=1)=>`<path d="M${x} ${y-s} Q${x+s*.15} ${y-s*.15} ${x+s} ${y} Q${x+s*.15} ${y+s*.15} ${x} ${y+s} Q${x-s*.15} ${y+s*.15} ${x-s} ${y} Q${x-s*.15} ${y-s*.15} ${x} ${y-s}Z" fill="${c}" opacity="${o}"/>`;
function auraLayer(glow,u,rand,cx,cy,col){
  if(!glow) return '';
  let s=`<defs>${rad(u+'au',col,glow>=3?.95:.7,col,0)}</defs><circle cx="${cx}" cy="${cy}" r="${glow>=3?78:64}" fill="url(#${u}au)"/>`;
  return s;
}
function sparkleLayer(glow,rand,col='#fff'){
  if(glow<2) return '';
  let s='';const n=glow>=3?9:5;
  for(let i=0;i<n;i++){s+=star4(8+rand()*156,8+rand()*114,3+rand()*(glow>=3?6:4),col,.9)}
  return s;
}

const starPath=(x,y,s)=>{let d='';for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?s*.45:s;d+=(i?'L':'M')+(x+Math.cos(a)*r).toFixed(1)+' '+(y+Math.sin(a)*r).toFixed(1)}return d+'Z'};

/* ---------- emblemas do peito ---------- */
function emblem(n,x,y,c='#fff'){
  const P=(d)=>`<path d="${d}" fill="${c}"/>`;
  switch(n){
    case'star':return P(starPath(x,y+.5,7.5));
    case'bolt':return P(`M${x+1} ${y-8}L${x-5} ${y+1}L${x-1} ${y+1}L${x-2} ${y+8}L${x+5} ${y-2}L${x+1} ${y-2}Z`);
    case'flame':return P(`M${x+1} ${y-8}C${x+7} ${y-2} ${x+7} ${y+7} ${x} ${y+7}C${x-7} ${y+7} ${x-6} ${y-1} ${x-2} ${y-3}C${x-2} ${y-1} ${x-1} ${y-1} ${x+1} ${y-8}Z`);
    case'drop':return P(`M${x} ${y-8}C${x+7} ${y+1} ${x+5} ${y+7} ${x} ${y+7}C${x-5} ${y+7} ${x-7} ${y+1} ${x} ${y-8}Z`);
    case'heart':return P(`M${x} ${y+6}C${x-9} ${y-1} ${x-4} ${y-8} ${x} ${y-3}C${x+4} ${y-8} ${x+9} ${y-1} ${x} ${y+6}Z`);
    case'moon':return P(`M${x+2} ${y-7}A7 7 0 1 0 ${x+2} ${y+7}A5.500 5.500 0 1 1 ${x+2} ${y-7}Z`);
    case'sun':return `<circle cx="${x}" cy="${y}" r="3.800" fill="${c}"/>`+[0,1,2,3,4,5,6,7].map(i=>{const a=i*Math.PI/4;return `<path d="M${(x+Math.cos(a)*5.500).toFixed(1)} ${(y+Math.sin(a)*5.500).toFixed(1)}L${(x+Math.cos(a)*8).toFixed(1)} ${(y+Math.sin(a)*8).toFixed(1)}" stroke="${c}" stroke-width="1.800" stroke-linecap="round"/>`}).join('');
    case'diamond':return P(`M${x} ${y-8}L${x+6} ${y}L${x} ${y+8}L${x-6} ${y}Z`);
    case'leaf':return P(`M${x-6} ${y+6}Q${x-7} ${y-6} ${x+6} ${y-7}Q${x+7} ${y+6} ${x-6} ${y+6}Z`)+`<path d="M${x-5} ${y+5}L${x+3} ${y-3}" stroke="#0006" stroke-width="1.200"/>`;
    case'gear':return `<circle cx="${x}" cy="${y}" r="3.800" fill="none" stroke="${c}" stroke-width="3"/><circle cx="${x}" cy="${y}" r="6.800" fill="none" stroke="${c}" stroke-width="2.600" stroke-dasharray="2.600 2.600"/>`;
    case'shield':return P(`M${x-6} ${y-6}L${x+6} ${y-6}L${x+6} ${y+1}Q${x+6} ${y+6} ${x} ${y+8}Q${x-6} ${y+6} ${x-6} ${y+1}Z`);
    case'cloud':return `<circle cx="${x-3}" cy="${y+1}" r="3.800" fill="${c}"/><circle cx="${x+1}" cy="${y-2}" r="4.800" fill="${c}"/><circle cx="${x+5}" cy="${y+1}" r="3.500" fill="${c}"/><rect x="${x-6.500}" y="${y+1}" width="15" height="4" rx="2" fill="${c}"/>`;
    case'paw':return `<ellipse cx="${x}" cy="${y+3}" rx="4.500" ry="3.600" fill="${c}"/>`+[[-5.500,-2],[-2,-5.500],[2,-5.500],[5.500,-2]].map(([a,b])=>`<circle cx="${x+a}" cy="${y+b}" r="1.900" fill="${c}"/>`).join('');
    default:return `<circle cx="${x}" cy="${y}" r="5.500" fill="none" stroke="${c}" stroke-width="2.800"/>`;
  }
}

function analyse(w){
  const syl=w.split('-').filter(Boolean), plain=syl.join('');
  const p2=plain.replace(/([qg])u(?=[eií])/g,'$1');
  const f={
    dig:/(ch|lh|nh|rr|ss)/.test(plain),
    rcl:new RegExp('(br|cr|dr|fr|gr|pr|tr)['+ACC+']').test(plain),
    lcl:new RegExp('(bl|cl|fl|gl|pl)['+ACC+']').test(plain),
    dit:/(ai|ei|oi|ui|ou|eu|iu|au)/.test(p2),
    nas:/ão|ãe|õe|ã|[aeiou][mn](?=[bcdfgjlpqstvxz]|$)/.test(plain),
    hia:new RegExp('['+ACC+']-['+ACC+']').test(w)
  };
  const score=Object.values(f).filter(Boolean).length+(syl.length>=3?1:0)+(syl.length>=4?1:0);
  return {w,syl,plain,p2,f,level:score===0?1:score<=2?2:3};
}

function pickSession(n){
  let p=pool().slice(); if(!p.length)p=allWords().filter(w=>w.level===1);
  const out=[];
  while(out.length<n&&p.length){
    const ws=p.map(weight);let r=Math.random()*ws.reduce((a,b)=>a+b,0),i=0;
    for(;i<p.length;i++){r-=ws[i];if(r<=0)break}
    out.push(p.splice(Math.min(i,p.length-1),1)[0]);
  }
  return out;
}

/* ---------- som ---------- */
let ac=null;
function AC(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended'){try{ac.resume()}catch(e){}}return ac}
function tone(f,t0,d,type='sine',v=.15){const a=AC();if(!a||!S.settings.sound)return;try{const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;const t=a.currentTime+t0;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
const sfx={
  coin(){tone(988,0,.1,'square',.07);tone(1319,.09,.22,'square',.07)},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.1,.25,'triangle',.18))},
  soft(){tone(330,0,.18,'sine',.1);tone(262,.12,.25,'sine',.09)},
  tap(){tone(620,0,.05,'sine',.07)},
  fan(){[392,494,587,784,988,1175].forEach((f,i)=>tone(f,i*.09,.4,'triangle',.16))}
};

/* ---------- voz (ler e ouvir) ---------- */
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()}catch(e){voices=[]}}
if('speechSynthesis' in window){loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices}catch(e){}}
const ptVoice=()=>voices.find(v=>/^pt[-_]PT/i.test(v.lang))||null;
function say(text,rate){
  return new Promise(res=>{
    if(!('speechSynthesis' in window)){res(false);return}
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);u.lang='pt-PT';const v=ptVoice();if(v)u.voice=v;
      u.rate=rate||S.settings.rate;u.pitch=1.05;u.onend=()=>res(true);u.onerror=()=>res(false);
      speechSynthesis.speak(u);setTimeout(()=>res(true),7000);
    }catch(e){res(false)}
  });
}
const SRC=window.SpeechRecognition||window.webkitSpeechRecognition;
function listen(){
  return new Promise(res=>{
    if(!SRC){res({error:'unsupported'});return}
    let done=false;const fin=o=>{if(done)return;done=true;try{r.stop()}catch(e){}res(o)};
    let r;
    try{
      r=new SRC();r.lang='pt-PT';r.maxAlternatives=5;r.interimResults=false;r.continuous=false;
      r.onresult=e=>{const alts=[];for(const a of e.results[0])alts.push(a.transcript);fin({alts})};
      r.onerror=e=>fin({error:e.error||'error'});
      r.onend=()=>fin({error:'no-speech'});
      r.start();setTimeout(()=>fin({error:'no-speech'}),9000);
    }catch(e){fin({error:'start'})}
  });
}

/* ---------- avaliação da fala ---------- */
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z\s]/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){
  const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++){cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1))}prev=cur}
  return prev[n];
}
const sim=(a,b)=>a||b?1-lev(a,b)/Math.max(a.length,b.length):1;
function evaluate(target,alts,tol){
  const t=norm(target),th={facil:.6,normal:.75,exigente:.88}[tol]||.75;
  let best=0,exact0=false,exactAny=false;
  alts.forEach((alt,i)=>{
    const n=norm(alt),whole=n.replace(/ /g,'');
    [...n.split(' '),whole].forEach(tok=>{if(!tok)return;if(tok===t){exactAny=true;if(i===0)exact0=true}best=Math.max(best,sim(tok,t))});
  });
  if(exact0)return{grade:'perfect',best:1};
  if(exactAny||best>=th)return{grade:'good',best};
  if(best>=th-.2)return{grade:'close',best};
  return{grade:'miss',best};
}
const COINS={perfect:3,good:2,close:1,miss:1};

let G=null;
const MSG={
  start:['Lê a palavra com calma. Depois diz em voz alta!','Vamos a isto! Diz a palavra.','Olha bem para as sílabas. Se precisares, toca no altifalante.'],
  perfect:['Fantástico!','Perfeito! Que bem dito!','Excelente!','Uau, disseste mesmo bem!'],
  good:['Muito bem!','Quase perfeito! Boa!','Boa! Ganhaste moedas.'],
  close:['Quase! Vamos tentar outra vez?','Estás perto! Mais uma vez.'],
  miss:['Não ouvi bem. Vamos outra vez, devagarinho.','Tenta outra vez. Ouve primeiro!'],
  effort:['Bom esforço! Ganhas uma moeda por tentares.','Tentaste e isso conta! Segue para a próxima.']
};
function startSession(){
  const words=pickSession(S.settings.size);
  if(!words.length){renderHome();return}
  G={words,i:0,earned:0,ok:0,best:0,tries:0,manual:S.settings.mic==='manual',phase:'ready',note:''};
  AC();renderPlay();
}
function renderPlay(){
  const w=G.words[G.i];
  const dots=G.words.map((_,i)=>`<span class="dot ${i<G.i?'on':i===G.i?'now':''}"></span>`).join('');
  setScreen(`
  <div class="top"><button class="iconbtn" data-act="quit" aria-label="Sair do jogo">${ICON.close}</button><div class="dots" aria-label="Palavra ${G.i+1} de ${G.words.length}">${dots}</div>${coinsPill()}</div>

  <div class="wordcard">${syllables(w)}</div>

  <div class="micwrap" id="micwrap"></div>
  <div class="earn" id="earn"></div>
  <div id="after"></div>`,'play');
  renderMic();
}
function renderMic(){
  const box=$('#micwrap');if(!box)return;
  if(G.phase==='result'){box.innerHTML='';return}
  if(G.manual){
    box.innerHTML=`<button class="btn alga big" data-act="read">${ICON.check} Já li a palavra</button><div class="hint" id="hint">${G.note||'Um adulto ouve e confirma.'}</div>`;
  } else {
    box.innerHTML=`<button class="mic" id="mic" data-act="mic" aria-label="Falar">${ICON.mic}</button><div class="hint" id="hint">${G.note||'Toca no microfone e diz a palavra.'}</div>`;
  }
}
const hint=t=>{const h=$('#hint');if(h)h.textContent=t};
function mood(m,msg){const mm=$('#mm'),b=$('#bubble');if(mm)mm.innerHTML=mascotSVG(m);if(b&&msg)b.textContent=msg}
async function doSlow(){
  if(G.slow)return;G.slow=true;const lb=$('#listen');if(lb)lb.classList.add('on');
  const w=G.words[G.i],syl=$$('.syl'),p=say(w.plain,.5),per=Math.max(330,1000/syl.length);
  for(const s of syl){s.classList.add('lit');await sleep(per);s.classList.remove('lit')}await p;
  if(G){G.slow=false;const l2=$('#listen');if(l2)l2.classList.remove('on')}
}
async function doMic(){
  if(G.phase==='listening')return;
  G.phase='listening';G.tries++;
  const mic=$('#mic');if(mic)mic.classList.add('listening');
  mood('happy','Estou a ouvir...');hint('Diz a palavra agora');
  speechSynthesis&&speechSynthesis.cancel&&speechSynthesis.cancel();
  const r=await listen();
  if(!G)return;
  G.phase='ready';
  if(r.error){
    G.tries--;
    if(r.error==='no-speech'||r.error==='aborted'){mood('happy','Não ouvi nada. Tenta outra vez!');renderMic();hint('Fala um pouco mais alto.');return}
    G.manual=true;G.note='O microfone não está disponível aqui. Um adulto ouve e confirma.';
    mood('happy','Vamos jogar com um adulto a ouvir!');renderMic();return;
  }
  const w=G.words[G.i],ev=evaluate(w.plain,r.alts,S.settings.tol);
  finishAttempt(ev.grade);
}
function finishAttempt(grade){
  const w=G.words[G.i],c=COINS[grade];
  if(c>G.best){S.coins+=c-G.best;G.earned+=c-G.best;G.best=c;save();bumpCoins()}
  const strong=grade==='perfect'||grade==='good';
  G.phase=(strong||G.tries>=2)?'result':'ready';
  const earn=$('#earn');
  earn.innerHTML=`<span class="fly">+${c} ${coinSVG()}</span>`;
  if(grade==='perfect'){sfx.win();mood('cheer',pick(MSG.perfect))}
  else if(grade==='good'){sfx.coin();mood('cheer',pick(MSG.good))}
  else{sfx.soft();mood('happy',G.tries>=2?pick(MSG.effort):pick(MSG[grade]))}
  renderMic();
  const after=$('#after');
  if(G.phase==='result'){
    after.innerHTML=`<button class="btn coral big" data-act="next">${G.i+1>=G.words.length?'Terminar':'Próxima'} ${ICON.play}</button>`;
  } else {
    after.innerHTML=`<div class="row"><button class="btn sol" data-act="retry">Outra vez</button><button class="btn ghost" data-act="skip">Próxima</button></div>
    <div class="adultbar" style="margin-top:8px"><button class="hold" data-hold="ok">Adulto: segura para confirmar "esteve bem"</button></div>`;
  }
  if(G.phase==='result'&&!strong&&G.best<2){after.innerHTML+=`<div class="adultbar" style="margin-top:8px"><button class="hold" data-hold="ok">Adulto: segura para confirmar "esteve bem"</button></div>`}
}
function manualGrade(g){
  G.tries=Math.max(G.tries,1);finishAttempt(g);
  if(g==='close'||g==='miss'){G.tries=2;G.phase='result';renderMic();$('#after').innerHTML=`<button class="btn coral big" data-act="next">${G.i+1>=G.words.length?'Terminar':'Próxima'} ${ICON.play}</button>`}
}

function nextWord(){
  const w=G.words[G.i],st=S.stats[w.plain]||(S.stats[w.plain]={n:0,ok:0,box:1});
  const ok=G.best>=2;st.n++;if(ok){st.ok++;st.box=Math.min(3,(st.box||1)+1)}else st.box=1;
  S.totals.words++;if(G.best===3)S.totals.perfect++;if(ok)G.ok++;

}

/* ---------- ecrã: porta para adultos ---------- */
let gateNext=null,gateA=0,gateB=0,gateIn='';
function renderGate(next){
  gateNext=next;gateA=6+Math.floor(Math.random()*4);gateB=6+Math.floor(Math.random()*4);gateIn='';
  const keys=[1,2,3,4,5,6,7,8,9].map(n=>`<button class="btn" data-act="key" data-k="${n}">${n}</button>`).join('');
  setScreen(`<div class="top"><button class="iconbtn" data-act="home" aria-label="Voltar">${ICON.back}</button><span></span><span></span></div>
  <h2>Área para adultos</h2>

  <h2 style="font-size:46px">${gateA} × ${gateB} = ?</h2>

  <div class="keypad">${keys}<button class="btn ghost" data-act="key" data-k="del" aria-label="Apagar">←</button><button class="btn" data-act="key" data-k="0">0</button><button class="btn alga" data-act="key" data-k="ok">OK</button></div>`,'gate');
}
function gateKey(k){
  if(k==='del')gateIn=gateIn.slice(0,-1);
  else if(k==='ok'){
    if(+gateIn===gateA*gateB){const n=gateNext;gateNext=null;n&&n();return}
    sfx.soft();renderGate(gateNext);return;
  } else if(gateIn.length<3)gateIn+=k;
  $('#ans').textContent=gateIn||' ';
}

/* ---------- ecrã: adultos ---------- */
function toggleIn(arr,v){const i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else arr.push(v);return arr}
function renderAdult(){
  const keep=$('#screen').scrollTop;
  const s=S.settings,n=pool().length,total=allWords().length;
  const chipBtn=c=>`<button class="chip" data-act="chip" data-id="${c.id}" aria-pressed="${s.chips.includes(c.id)}">${c.l}</button>`;
  const sw=(k,l)=>`<div class="switch"><span>${l}</span><button data-act="sw" data-k="${k}" aria-pressed="${!!s[k]}" aria-label="${l}"></button></div>`;
  const hard=Object.entries(S.stats).filter(([k,v])=>v.n>0&&v.ok<v.n).sort((a,b)=>(b[1].n-b[1].ok)-(a[1].n-a[1].ok)).slice(0,14);
  const hasPT=!!ptVoice();
  setScreen(`<div class="top"><button class="iconbtn" data-act="home" aria-label="Voltar">${ICON.back}</button><h2>Adultos</h2><span></span></div>
  <div class="panel"><h3>Que palavras treinar?</h3>
    <p class="muted"><b>${n}</b> de ${total} palavras prontas. As terminações e os sons funcionam em conjunto: escolhe várias e aparecem as palavras que cumprem qualquer uma.</p>
    <div class="chips">${PRESETS.map((p,i)=>`<button class="btn small ghost" data-act="preset" data-i="${i}">${p.l}</button>`).join('')}</div>
    <div class="field"><span class="lab">Dificuldade</span><div class="chips">${[[1,'1 · Simples'],[2,'2 · Médio'],[3,'3 · Difícil']].map(([l,t])=>`<button class="chip" data-act="level" data-l="${l}" aria-pressed="${s.levels.includes(l)}">${t}</button>`).join('')}</div></div>
    <div class="field"><span class="lab">Terminações</span><div class="chips">${CHIPS.filter(c=>c.g==='end').map(chipBtn).join('')}</div></div>
    <div class="field"><span class="lab">Sons e grupos de letras</span><div class="chips">${CHIPS.filter(c=>c.g==='snd').map(chipBtn).join('')}</div></div>
    <button class="btn small ghost" data-act="clearchips">Limpar filtros de terminação e sons</button>
  </div>
  <div class="panel"><h3>As tuas palavras</h3>
    <div class="field"><label for="custom">Uma palavra por linha. Separa as sílabas com hífen: ca-va-lo</label><textarea id="custom" placeholder="ca-va-lo&#10;lo-co-mo-ti-va">${esc(s.custom.join('\n'))}</textarea></div>
    <button class="btn small" data-act="savecustom">Guardar palavras</button>
  </div>
  <div class="panel"><h3>Palavras a treinar</h3>
    ${hard.length?`<div class="train">${hard.map(([k,v])=>`<span>${esc(k)} <small>${v.n-v.ok}×</small></span>`).join('')}</div><p class="muted">São as que mais custaram. Voltam a aparecer mais vezes.</p>`:'<p class="muted">Ainda sem dados. Depois de alguns jogos aparecem aqui as palavras mais difíceis.</p>'}
    <p class="muted">${S.totals.words} palavras lidas · ${S.totals.perfect} perfeitas · ${S.totals.sessions} jogos</p>
  </div>
  <div class="panel"><h3>Jogo</h3>
    <div class="field"><label for="tol">Quanto a máquina deve exigir na pronúncia</label><select id="tol" data-act="set" data-k="tol"><option value="facil" ${s.tol==='facil'?'selected':''}>Pouco (mais fácil)</option><option value="normal" ${s.tol==='normal'?'selected':''}>Normal</option><option value="exigente" ${s.tol==='exigente'?'selected':''}>Muito</option></select></div>
    <div class="field"><label for="size">Palavras por jogo</label><select id="size" data-act="set" data-k="size" data-n="1">${[5,8,10,12].map(v=>`<option ${s.size===v?'selected':''}>${v}</option>`).join('')}</select></div>
    <div class="field"><label for="cap">Jogos por dia</label><select id="cap" data-act="set" data-k="cap" data-n="1">${[1,2,3,4,5,6,99].map(v=>`<option value="${v}" ${s.cap===v?'selected':''}>${v===99?'Sem limite':v}</option>`).join('')}</select></div>
    <div class="field"><label for="mic">Como confirmar a leitura</label><select id="mic" data-act="set" data-k="mic"><option value="auto" ${s.mic==='auto'?'selected':''}>Pelo microfone (se funcionar)</option><option value="manual" ${s.mic==='manual'?'selected':''}>Sempre com um adulto a ouvir</option></select></div>
    <div class="field"><label for="rate">Velocidade da voz</label><input id="rate" type="range" min="0.5" max="1.1" step="0.05" value="${s.rate}" data-act="rate"></div>
    ${sw('spaced','Letras mais espaçadas')}${sw('upper','Letras maiúsculas')}${sw('sound','Sons e música')}
    <button class="btn small ghost" data-act="testvoice">${ICON.speaker} Testar a voz</button>
  </div>
  <div class="panel"><h3>Estado do aparelho</h3>
    <p>Voz em português de Portugal: <b>${hasPT?'encontrada':'não encontrada'}</b></p>
    ${hasPT?'':'<div class="note">No Android: Definições, Sistema, Idiomas, Texto para voz. Instala a voz "Português (Portugal)".</div>'}
    <p>Reconhecimento de voz: <b>${SRC?'disponível neste navegador':'indisponível'}</b></p>
    <div class="note">O microfone usa o serviço de voz do navegador, que envia o áudio à Google. Se não quiseres, escolhe "Sempre com um adulto a ouvir".</div>
    ${storageOK?'':'<div class="warn">Não consigo guardar o progresso neste ecrã. Abre a app no navegador.</div>'}
  </div>
  <div class="panel"><h3>Personagem</h3><p class="muted">As cartas mostram a menina ou o menino que escolheram no início.</p><button class="btn small ghost" data-act="changehero">Escolher outra vez menina ou menino</button></div>
  <div class="panel"><h3>Recomeçar</h3><button class="btn small coral" data-act="reset">Apagar moedas, cartas e estatísticas</button></div>`,'adult');
  $('#screen').scrollTop=keep;
}

/* ---------- ações ---------- */
function go(name){
  if(G&&name!=='play')G=null;
  if(name==='home')renderHome();
  else if(name==='shop')renderShop();
  else if(name==='album')renderAlbum();
}
const actions={
  start(){startSession()},
  pick(el){S.avatar=el.dataset.a;setHeroAvatar(S.avatar);save();sfx.fan();renderHome()},
  changehero(){S.avatar=null;save();renderPick()},
  home(){go('home')},shop(){go('shop')},album(){go('album')},
  adult(){renderGate(()=>renderAdult())},
  more(){renderGate(()=>{daily().extra++;save();renderHome()})},
  quit(){const m=modal(`<h3>Queres parar?</h3><p class="muted">As moedas que ganhaste ficam guardadas.</p><div class="row" style="width:100%"><button class="btn ghost" data-act="mclose">Continuar</button><button class="btn coral" data-act="quitok">Parar</button></div>`)},
  quitok(){$$('.overlay').forEach(o=>o.remove());go('home')},
  slow(){doSlow()},
  mic(){doMic()},
  read(){showManualChoices()},
  mg(el){const g=el.dataset.g;if(g==='retry'){renderMic();G.phase='ready';mood('happy','Vamos outra vez!');return}manualGrade(g)},
  retry(){G.phase='ready';$('#after').innerHTML='';$('#earn').innerHTML='';renderMic();mood('happy','Tenta outra vez, com calma.')},
  skip(){nextWord()},
  next(){nextWord()},
  shoptab(el){shopCat=el.dataset.cat;renderShop()},
  albumtab(el){albumCat=el.dataset.cat;renderAlbum()},
  buy(el){askBuy(el.dataset.id)},
  confirmbuy(el){buy(el.dataset.id)},
  view(el){viewCard(el.dataset.id,false)},
  peek(el){viewCard(el.dataset.id,true)},
  mclose(){$$('.overlay').forEach(o=>o.remove())},
  'mclose-shop'(){$$('.overlay').forEach(o=>o.remove());renderShop()},
  'mclose-album'(){$$('.overlay').forEach(o=>o.remove());albumCat='all';renderAlbum()},
  key(el){gateKey(el.dataset.k)},
  chip(el){toggleIn(S.settings.chips,el.dataset.id);save();renderAdult()},
  level(el){const l=+el.dataset.l,a=S.settings.levels;if(a.includes(l)&&a.length===1)return;toggleIn(a,l);save();renderAdult()},
  preset(el){const p=PRESETS[+el.dataset.i];S.settings.levels=p.levels.slice();S.settings.chips=p.chips.slice();save();renderAdult()},
  clearchips(){S.settings.chips=[];save();renderAdult()},
  sw(el){const k=el.dataset.k;S.settings[k]=!S.settings[k];save();renderAdult()},
  savecustom(){
    const lines=$('#custom').value.split('\n').map(l=>l.trim().toLowerCase().replace(/\s+/g,'-')).filter(l=>/^[a-záéíóúâêôàãõç-]+$/.test(l)&&!l.startsWith('-')&&!l.endsWith('-'));
    S.settings.custom=[...new Set(lines)];save();renderAdult();
  },
  testvoice(){AC();say('Olá! Vamos ler palavras juntos.')},
  reset(){modal(`<h3>Apagar tudo?</h3><p class="muted">As moedas, as cartas e as estatísticas desaparecem. Os filtros ficam.</p><div class="row" style="width:100%"><button class="btn ghost" data-act="mclose">Não</button><button class="btn coral" data-act="resetok">Apagar</button></div>`)},
  resetok(){const st=S.settings;S=merge({});S.settings=st;save();$$('.overlay').forEach(o=>o.remove());renderAdult()}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  if(['slow','mic','read','start','next','skip','retry','buy','view','peek','chip','level','preset','sw','mg'].includes(a))sfx.tap();
  if(actions[a])actions[a](el);
});
document.addEventListener('change',e=>{
  const el=e.target.closest('select[data-act="set"]');if(!el)return;
  const k=el.dataset.k;S.settings[k]=el.dataset.n?+el.value:el.value;save();renderAdult();
});
document.addEventListener('input',e=>{
  const el=e.target.closest('input[data-act="rate"]');if(!el)return;
  S.settings.rate=+el.value;save();
});
/* botão "segurar para confirmar" (só adultos) */
let holdT=null;
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest('[data-hold]');if(!h)return;
  h.classList.add('holding');
  holdT=setTimeout(()=>{h.classList.remove('holding');if(!G)return;G.tries=2;finishAttempt('perfect');G.phase='result';renderMic();$('#after').innerHTML=`<button class="btn coral big" data-act="next">${G.i+1>=G.words.length?'Terminar':'Próxima'} ${ICON.play}</button>`},1000);
});
['pointerup','pointercancel','pointerleave'].forEach(t=>document.addEventListener(t,e=>{
  const h=e.target.closest&&e.target.closest('[data-hold]');if(h)h.classList.remove('holding');clearTimeout(holdT);
},true));

/* teste e arranque */
window.__PM={S:()=>S,WORDS,CHIPS,evaluate,analyse,pool,renderHome,renderShop,renderAlbum,renderAdult,startSession,go,actions,G:()=>G,buy,setCoins:n=>{S.coins=n;save()}};
renderHome();
})();

</script>
<script>if("serviceWorker" in navigator&&location.protocol.startsWith("http")){navigator.serviceWorker.register("sw.js").catch(function(){});}</script>
</body>
</html>
